[project]
name = "kirinuki"
version = "0.1.0"
description = "最強切り抜きAI: 長尺動画から見どころを検出し、縦型ショートを自動生成"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
llm = ["anthropic>=0.70"]
dev = ["pytest>=8"]

[project.scripts]
kirinuki = "kirinuki.cli:main"

[tool.setuptools]
packages = ["kirinuki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
